version: '3.8'

services:
  impala:
    image: apache/kudu:impala-latest
    container_name: impala-doan
    hostname: impala-doan
    platform: linux/amd64
    ports:
      - "21000:21000" # Impala Shell / Beeswax port
      - "21050:21050" # Impala HS2 port
      - "25000:25000" # Impala Web UI (Impalad)
      - "25010:25010" # Statestore Web UI
      - "25020:25020" # Catalog Web UI
    volumes:
      - ../data:/data/data:rw
      - ../datamining:/data/datamining:rw
      - ../sql:/scripts/sql:ro
      - ./custom-entrypoint.sh:/impala-entrypoint.sh:ro
    command: /impala-entrypoint.sh
    environment:
      - IMPALA_MEM_LIMIT=6g
      - JAVA_TOOL_OPTIONS=-Xmx3g
    restart: unless-stopped
